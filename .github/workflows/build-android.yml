name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        type: choice
        default: debug
        options:
          - debug
          - release
      prerelease:
        description: Publish build as a GitHub prerelease (uses app versionName)
        type: boolean
        default: false

jobs:
  # ───────────────────────────────────────────────
  # Android — APK build
  # ───────────────────────────────────────────────
  build-android:
    name: Android APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # versionName / versionCode come straight from app/build.gradle —
      # it's the single source of truth. Edit them there per release.

      - name: Restore signing keystore
        # SIGNING_KEYSTORE_BASE64 is a repo secret holding
        # `base64 -w0 yamtrack-release.jks`. Absent (e.g. forks) -> the
        # build falls back to the debug keystore automatically.
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" = "release" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate APKs
        id: locate
        run: |
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' | sort)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          {
            echo 'paths<<EOF'
            printf '%s\n' "${apks[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yamtrack-android-${{ github.run_number }}
          path: ${{ steps.locate.outputs.paths }}
          if-no-files-found: error

  # ───────────────────────────────────────────────
  # Tag-driven release: collects APK artifacts and
  # creates a draft GitHub Release.
  # ───────────────────────────────────────────────
  upload-release:
    name: Release
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: Yamtrack ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: |
            dist/Yamtrack-android-*/**/*.apk

  # ───────────────────────────────────────────────
  # Manual prerelease: when the workflow is dispatched with
  # `prerelease=true`, publish the freshly-built APK(s) as a
  # GitHub prerelease named after the app's versionName.
  # ───────────────────────────────────────────────
  upload-prerelease:
    name: Prerelease
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read versionName from app/build.gradle
        id: version
        run: |
          version_name=$(grep -E '^[[:space:]]*versionName[[:space:]]+' app/build.gradle \
            | head -n1 \
            | sed -E 's/.*versionName[[:space:]]+"([^"]+)".*/\1/')
          if [ -z "$version_name" ]; then
            echo "Could not parse versionName from app/build.gradle" >&2
            exit 1
          fi
          # Tag-safe slug (spaces -> dots) so e.g. "Beta 0.0.4" -> "v-Beta.0.0.4"
          tag_slug=$(echo "$version_name" | tr ' ' '.')
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "tag=v-$tag_slug-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.name }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/Yamtrack-android-*/**/*.apk

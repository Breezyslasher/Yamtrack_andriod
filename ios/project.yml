# XcodeGen spec: `xcodegen generate` (run by CI) creates Yamtrack.xcodeproj.
# The generated project is not committed.
name: Yamtrack
options:
  bundleIdPrefix: io.github.breezyslasher
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Yamtrack:
    type: application
    platform: iOS
    # A shared scheme, so CI can build with `xcodebuild -scheme Yamtrack`.
    scheme: {}
    sources:
      - path: Yamtrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.breezyslasher.yamtrack
        PRODUCT_NAME: Yamtrack
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Yamtrack Unofficial
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: Yamtrack/Info.plist
      properties:
        # Self-hosted servers are often plain HTTP on the home network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UIUserInterfaceStyle: Dark

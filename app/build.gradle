plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.yamtrack.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.yamtrack.app"
        minSdk 24
        targetSdk 34
        // Single source of truth for the app version. Bump these per
        // release (CI no longer rewrites them). versionCode must not
        // decrease or installs will refuse to downgrade.
        versionCode 1
        versionName "Beta 0.0.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Default Yamtrack server configuration
        buildConfigField "String", "DEFAULT_SERVER_URL", '"https://yamtrack.fuzzygrim.com"'
    }

    // A single checked-in keystore signs every build (debug + release, local
    // + CI). Without this, debug builds and each ephemeral CI build use a
    // different key, so a new APK fails to install over an old one with
    // "App conflicts with an existing package". This key is intentionally
    // low-secret because the app is sideloaded, not Play-distributed.
    signingConfigs {
        shared {
            storeFile file("yamtrack-release.jks")
            storePassword "yamtrack"
            keyAlias "yamtrack"
            keyPassword "yamtrack"
        }
    }

    buildTypes {
        release {
            // R8 full mode strips generic signatures and breaks Gson/
            // Retrofit parameterized-type resolution even with keep rules.
            // This is a sideloaded app, so just disable shrinking like
            // debug — reliability over a smaller APK.
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.shared
            resValue "string", "app_name", "Yamtrack"
        }
        debug {
            minifyEnabled false
            debuggable true
            signingConfig signingConfigs.shared
            // Distinct package + label so a debug build installs alongside
            // a release build instead of replacing it.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "app_name", "Yamtrack Debug"
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        // NullSafeMutableLiveData is a known false positive when a
        // MutableLiveData<NonNull> is assigned from Kotlin: the Java generic
        // erasure makes lint think the value could be null even though these
        // assignments (DataStore Flow.first(), non-null result.data) never
        // are. It blocks lintVitalRelease, so disable just this check.
        disable 'NullSafeMutableLiveData'
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'
    
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    
    // Networking - Retrofit for REST API
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // Gson for JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Dependency Injection
    implementation 'com.google.dagger:hilt-android:2.51.1'
    kapt 'com.google.dagger:hilt-compiler:2.51.1'
    
    // Image Loading
    implementation 'io.coil-kt:coil:2.5.0'
    
    // DataStore for preferences
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Encrypted storage for the API token (Keystore-backed)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    
    // SwipeRefreshLayout
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

kapt {
    correctErrorTypes true
}

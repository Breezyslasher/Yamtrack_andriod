plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.yamtrack.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.yamtrack.app"
        minSdk 24
        targetSdk 34
        // Single source of truth for the app version. Bump these per
        // release (CI no longer rewrites them). versionCode must not
        // decrease or installs will refuse to downgrade.
        versionCode 2
        versionName "Beta 0.0.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Default Yamtrack server configuration
        buildConfigField "String", "DEFAULT_SERVER_URL", '"https://yamtrack.fuzzygrim.com"'
    }

    // Release signing key is resolved at build time, never committed:
    //   1. keystore.properties at the repo root (gitignored, local dev)
    //   2. SIGNING_* environment variables (GitHub Actions secrets, CI)
    // If neither is present the release falls back to the standard
    // Android debug keystore so builds still succeed (just not
    // consistently signed). Configure the secrets once to keep the
    // "installs over the old build" convenience.
    def keystorePropsFile = rootProject.file("keystore.properties")
    def hasSharedSigning = false
    if (keystorePropsFile.exists()) {
        def kp = new Properties()
        keystorePropsFile.withInputStream { kp.load(it) }
        signingConfigs {
            shared {
                storeFile file(kp.getProperty("storeFile"))
                storePassword kp.getProperty("storePassword")
                keyAlias kp.getProperty("keyAlias")
                keyPassword kp.getProperty("keyPassword")
            }
        }
        hasSharedSigning = true
    } else if (System.getenv("SIGNING_STORE_FILE")) {
        signingConfigs {
            shared {
                storeFile file(System.getenv("SIGNING_STORE_FILE"))
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
        hasSharedSigning = true
    }

    // Override AGP's default debug signing config to use a committed
    // keystore at app/debug.keystore (well-known credentials). Without
    // this, every machine — and every CI runner — generates a fresh
    // ~/.android/debug.keystore, so debug APKs from different builds
    // have different signing certs and Android refuses to update over
    // them with "App not installed".
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            // R8 full mode strips generic signatures and breaks Gson/
            // Retrofit parameterized-type resolution even with keep rules.
            // This is a sideloaded app, so just disable shrinking like
            // debug — reliability over a smaller APK.
            minifyEnabled false
            shrinkResources false
            // Always assign a signing config: an unsigned release APK
            // fails to install on Android with "App not installed".
            // Prefer the shared release key when configured; otherwise
            // fall back to the always-available debug keystore so the
            // APK is at least signed and installable.
            signingConfig hasSharedSigning ? signingConfigs.shared : signingConfigs.debug
            resValue "string", "app_name", "Yamtrack"
        }
        debug {
            minifyEnabled false
            debuggable true
            // Always use the committed debug keystore (configured above)
            // so debug APKs from local builds and CI runs share the same
            // signing cert and can update over each other.
            signingConfig signingConfigs.debug
            // Distinct package + label so a debug build installs alongside
            // a release build instead of replacing it.
            applicationIdSuffix ".debug"
            // Append the CI run number when building on GitHub Actions so
            // successive debug APKs are easy to tell apart in About; falls
            // back to "-debug" for local builds.
            def runNumber = System.getenv("GITHUB_RUN_NUMBER")
            versionNameSuffix runNumber ? ".${runNumber}" : "-debug"
            resValue "string", "app_name", "Yamtrack Debug"
        }
    }

    // Rename the release APK so the file itself carries the version,
    // e.g. Yamtrack.Andriod.Beta-0.0.4.apk. Debug keeps the AGP default.
    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            def slug = variant.versionName.replace(' ', '-')
            variant.outputs.all { output ->
                output.outputFileName = "Yamtrack.Andriod.${slug}.apk"
            }
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        // NullSafeMutableLiveData is a known false positive when a
        // MutableLiveData<NonNull> is assigned from Kotlin: the Java generic
        // erasure makes lint think the value could be null even though these
        // assignments (DataStore Flow.first(), non-null result.data) never
        // are. It blocks lintVitalRelease, so disable just this check.
        disable 'NullSafeMutableLiveData'
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'
    
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    
    // Networking - Retrofit for REST API
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Moshi for JSON parsing (reflective Kotlin adapter)
    implementation 'com.squareup.moshi:moshi:1.15.1'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.1'
    
    // Dependency Injection
    implementation 'com.google.dagger:hilt-android:2.51.1'
    kapt 'com.google.dagger:hilt-compiler:2.51.1'
    
    // Image Loading
    implementation 'io.coil-kt:coil:2.5.0'
    
    // DataStore for preferences
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Encrypted storage for the API token (Keystore-backed)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    
    // SwipeRefreshLayout
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

kapt {
    correctErrorTypes true
}
